<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест — А331</title>
<link rel="icon" href="../images/favicon.ico">
</head>
<body>

<div class="test-page">
    <div class="header">
        <a href="../index.html" class="logo"><img src="../images/logo_black.svg" alt="А331"></a>
        <div class="nav">
            <a href="./routes.html" class="nav-link">МАРШРУТЫ</a>
            <a href="./catalogtests.html" class="nav-link active">ТЕСТЫ</a>
            <a href="./catalog.html" class="nav-link">СТАТЬИ</a>
            <a href="#" class="nav-link">О НАС</a>
        </div>
    </div>

    <form class="test-quiz" novalidate>
        <div class="test-step">Шаг <span class="test-step-current">1</span>/<span class="test-step-total">10</span></div>

        <fieldset class="test-fieldset">
            <legend class="test-question"></legend>
            <div class="test-options"></div>
        </fieldset>

        <div class="test-actions">
            <button type="button" class="test-btn test-btn--outline test-prev">Предыдущий вопрос</button>
            <button type="submit" class="test-btn test-btn--filled test-next">Следующий вопрос</button>
        </div>
    </form>

    <div class="test-result" hidden>
        <div class="test-result-text">
            <h1 class="test-result-title">Ваш результат:<br><span class="test-result-score"></span></h1>
            <div class="test-result-desc"></div>
            <div class="test-result-actions">
                <button type="button" class="test-btn test-btn--filled test-restart">Пройти ещё раз</button>
                <a href="./catalogtests.html" class="test-btn test-btn--outline">Все тесты</a>
            </div>
        </div>
        <img src="../images/quiz_pic.png" alt="Автодом на лесной дороге в лучах солнца" class="test-result-img">
    </div>
</div>

<footer class="site-footer">
    <img src="../images/footer.png" alt="" class="site-footer-bg">
    <div class="site-footer-inner">
        <div class="site-footer-about">
            <div class="site-footer-title">А331</div>
            <p class="site-footer-text">Онлайн-медиа о караванинге по России. Маршруты, тесты и статьи для подготовки к путешествию</p>
        </div>
        <nav class="site-footer-nav" aria-label="Разделы">
            <div class="site-footer-title">Разделы</div>
            <a href="#">О нас</a>
            <a href="./routes.html">Маршруты</a>
            <a href="./catalogtests.html">Тесты</a>
            <a href="./catalog.html">Статьи</a>
        </nav>
        <div class="site-footer-side">
            <div class="site-footer-logos">
                <img src="../images/shd_logo.svg" alt="ШД" class="site-footer-shd">
                <a href="../index.html" class="site-footer-logo"><img src="../images/logo-svg.svg" alt="А331"></a>
            </div>
            <div class="site-footer-contacts">
                <a href="mailto:support_a331@yandex.ru">support_a331@yandex.ru</a>
                <a href="#" class="site-footer-agreement">Пользовательское соглашение</a>
            </div>
        </div>
    </div>
</footer>

</body>
</html>
